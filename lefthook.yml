pre-commit:
  parallel: true
  commands:
    format:
      glob: "*.md"
      # --silently-ignore: staged artifact files are in .remarkignore, and naming an
      # ignored file explicitly is otherwise a hard error.
      run: npx remark {staged_files} -o -q --silently-ignore && node scripts/fix-github-alerts.js {staged_files}
      stage_fixed: true

commit-msg:
  parallel: true
  commands:
    commitlint:
      run: npx commitlint --edit {1} --strict
